[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Deliberately no startCommand / preDeployCommand here. A startCommand
# overrides the image CMD, and the Dockerfile's CMD is what runs
# `alembic upgrade head` (and the optional admin seed) before uvicorn.
# Railway also ignored preDeployCommand from this file (manifest showed
# null), so the Dockerfile is the single start path on any Docker host.
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
